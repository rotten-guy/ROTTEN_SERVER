# Serveur Minecraft (modpack Modrinth) + sauvegardes automatiques
# Lancer : docker compose up -d     Logs : docker compose logs -f mc
services:
  mc:
    image: itzg/minecraft-server:java21   # java21 = Minecraft 1.20.5 -> 1.21.x
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"            # NE PAS rediriger ce port sur la box : on passe par Tailscale
    environment:
      EULA: "TRUE"
      TYPE: MODRINTH
      MODRINTH_MODPACK: /modpacks/pack.mrpack   # ton .mrpack (les mods client sont exclus tout seuls)
      MEMORY: ${MC_MEMORY:-3G}                  # 5,7 Go au total : 3G max (voir README)
      USE_AIKAR_FLAGS: "true"                   # réglages JVM optimisés
      TZ: Europe/Paris

      # Monde
      HARDCORE: "true"
      DIFFICULTY: hard
      MOTD: "Homelab - Hardcore"
      VIEW_DISTANCE: 8
      SIMULATION_DISTANCE: 6
      MAX_PLAYERS: 5

      # Accès
      ENABLE_WHITELIST: "true"
      WHITELIST: ${MC_WHITELIST}
      OPS: ${MC_OPS}

      # RCON (utilisé par les sauvegardes et `docker exec minecraft rcon-cli`)
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD}
    volumes:
      - ./data:/data
      - ./modpacks:/modpacks:ro

  backups:
    image: itzg/mc-backup
    container_name: minecraft-backup
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      RCON_HOST: mc
      RCON_PASSWORD: ${RCON_PASSWORD}
      BACKUP_INTERVAL: "6h"
      INITIAL_DELAY: "5m"
      PRUNE_BACKUPS_DAYS: 7          # garde 7 jours d'historique
      PAUSE_IF_NO_PLAYERS: "true"    # pas de backup inutile quand personne ne joue
      TZ: Europe/Paris
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
