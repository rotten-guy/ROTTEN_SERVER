# Minecraft server (Modrinth modpack) + automatic world backups
# Deploy from Dockge, or: docker compose up -d   — logs: docker compose logs -f mc
services:
  mc:
    image: itzg/minecraft-server:java21   # java21 = Minecraft 1.20.5 -> 1.21.x (26.x needs java25)
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"            # NEVER forward this on the router: access goes through Tailscale
    environment:
      EULA: "TRUE"
      TYPE: MODRINTH
      MODRINTH_MODPACK: /modpacks/pack.mrpack   # your .mrpack (client-only mods are skipped automatically)
      MEMORY: ${MC_MEMORY:-3G}                  # 5.7 GB total on this box: 3G max (see docs)
      USE_AIKAR_FLAGS: "true"                   # tuned JVM flags
      MAX_TICK_TIME: "-1"                       # no watchdog: on the Celeron, heavy worldgen (Incendium…) can stall a tick >60 s and get the server killed
      TZ: Europe/Paris

      # World
      HARDCORE: "true"
      DIFFICULTY: hard
      MOTD: "rotten-server - Hardcore"
      VIEW_DISTANCE: 8
      SIMULATION_DISTANCE: 6
      MAX_PLAYERS: 5

      # Access
      ENABLE_WHITELIST: "true"
      WHITELIST: ${MC_WHITELIST}
      OPS: ${MC_OPS}

      # RCON (used by mc-backup and `docker exec minecraft rcon-cli`)
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD}
    volumes:
      - ./data:/data
      - ./modpacks:/modpacks:ro

  backups:
    image: itzg/mc-backup
    container_name: minecraft-backup
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      RCON_HOST: mc
      RCON_PASSWORD: ${RCON_PASSWORD}
      BACKUP_INTERVAL: "12h"
      INITIAL_DELAY: "5m"
      PRUNE_BACKUPS_DAYS: 3          # world can weigh GBs once pre-generated: keep 3 days on the server
      PAUSE_IF_NO_PLAYERS: "true"    # no pointless backups while nobody plays (also skips Chunky-only runs)
      TAR_COMPRESS_METHOD: zstd      # much faster than gzip on the Celeron -> .tar.zst archives
      TZ: Europe/Paris
    volumes:
      - ./data:/data:ro
      - /opt/backups/minecraft:/backups   # pulled to the desktop with everything else
