# Vaultwarden: self-hosted, Bitwarden-compatible password manager
# No published port: only reachable through the reverse proxy over HTTPS (required).
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.rotten-guy.com
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}   # true only while creating your account
      TZ: Europe/Paris
    volumes:
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
