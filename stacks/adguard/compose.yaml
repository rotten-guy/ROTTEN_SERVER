# AdGuard Home: DNS server + ad blocker for every device on the tailnet
# First-run wizard: http://rotten-server:3000
# ⚠️ In the wizard: admin web UI on port 3000 (NOT 80, taken by the proxy), DNS on 53.
services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    networks:
      - proxy

networks:
  proxy:
    external: true
