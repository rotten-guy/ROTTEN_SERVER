# Nginx Proxy Manager: reverse proxy + HTTPS certificates (Let's Encrypt, OVH DNS challenge)
# Admin UI: https://proxy.rotten-guy.com (fallback: http://rotten-server:81)
services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"        # admin UI; can be removed once proxy.rotten-guy.com works
    environment:
      TZ: Europe/Paris
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    external: true
