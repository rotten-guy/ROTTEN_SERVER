# Dockge: web UI managing the compose stacks in /opt/stacks
# Installed to /opt/dockge by scripts/setup.sh — https://dockge.rotten-guy.com (fallback :5001)
services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /opt/stacks:/opt/stacks      # same path inside and outside: required by Dockge
    networks:
      - proxy

networks:
  proxy:
    external: true
