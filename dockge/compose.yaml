# Dockge : interface web pour gérer les stacks de /opt/stacks
# Installé dans /opt/dockge par scripts/setup.sh — http://192.168.1.107:5001
services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /opt/stacks:/opt/stacks      # même chemin dedans et dehors : obligatoire
    networks:
      - proxy

networks:
  proxy:
    external: true
